services:
  - type: web
    name: day14-agent
    runtime: docker
    # render.yaml nằm trong thư mục con nên chỉ rõ đường dẫn tính từ gốc repo
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh, không ghi giá trị vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []                  # chỉ cho phép truy cập nội bộ từ các service trong cùng workspace
    maxmemoryPolicy: allkeys-lru
