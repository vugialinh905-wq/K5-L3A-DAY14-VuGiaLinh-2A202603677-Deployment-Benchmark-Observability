[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# Biến AGENT_API_KEY, REDIS_URL, ... đặt trên dashboard Railway (railway variables set), không ghi ở đây.
# Railway cấp biến PORT; CMD trong Dockerfile đã lắng nghe theo ${PORT}.
